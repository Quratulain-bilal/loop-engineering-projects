name: Secret Drill - Both Methods

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  # RUN 1: This will FAIL - trying to read from .env file
  run-with-env-file:
    runs-on: ubuntu-latest
    name: "Run 1: Reading from .env (WILL FAIL)"
    steps:
      - uses: actions/checkout@v4
      
      - name: Try to read from .env file
        run: |
          echo "=== Attempting to read from .env file ==="
          if [ -f .env ]; then
            echo "✓ .env file exists (unexpected in cloud!)"
            cat .env
          else
            echo "✗ .env file does NOT exist"
            echo "This is expected! .env is gitignored."
            echo "Gitignored files never reach GitHub."
            echo "Cloud clones start fresh from the repo."
          fi
          
          echo ""
          echo "=== Checking environment variables ==="
          if [ -n "$API_TOKEN" ]; then
            echo "✓ API_TOKEN found in environment: ${API_TOKEN:0:10}..."
          else
            echo "✗ API_TOKEN not found in environment"
            echo "Add it in the repository secrets panel!"
          fi

  # RUN 2: This will SUCCEED - reading from environment variables
  run-with-env-variables:
    runs-on: ubuntu-latest
    name: "Run 2: Reading from env vars (WILL SUCCEED)"
    steps:
      - uses: actions/checkout@v4
      
      - name: Read from environment variables
        env:
          # This is where secrets LIVE in cloud environments
          # They're set in Settings → Secrets and variables → Actions
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "=== Reading from environment variables ==="
          
          if [ -n "$API_TOKEN" ]; then
            echo "✓ API_TOKEN found: ${API_TOKEN:0:10}..."
            echo "✓ This works because secrets are set in the repo settings"
            echo "✓ They are NOT in the code, they're in the platform"
          else
            echo "✗ API_TOKEN not found"
            echo "Add it: Settings → Secrets → Actions → New repository secret"
          fi
          
          echo ""
          echo "=== The Fix ==="
          echo "1. Go to your repo on GitHub"
          echo "2. Settings → Secrets and variables → Actions"
          echo "3. Click 'New repository secret'"
          echo "4. Name: API_TOKEN"
          echo "5. Value: your-actual-token"
          echo "6. Save"
          echo ""
          echo "Then in your workflow:"
          echo "  env:"
          echo "    API_TOKEN: \${{ secrets.API_TOKEN }}"
          echo ""
          echo "This is the CORRECT way to handle secrets in cloud!"