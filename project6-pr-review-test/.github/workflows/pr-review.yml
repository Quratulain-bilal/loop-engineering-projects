name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Review PR
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            
            // Check for common bugs
            for (const file of files.data) {
              if (file.filename.endsWith('.js') || file.filename.endsWith('.ts')) {
                const content = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: pr.head.sha,
                  path: file.filename
                });
                
                const code = Buffer.from(content.data.content, 'base64').toString();
                const lines = code.split('\n');
                
                // Look for common issues
                const issues = [];
                
                // Off-by-one errors: i <= array.length
                lines.forEach((line, index) => {
                  if (line.match(/i\s*<=\s*\w+\.length/) || line.match(/i\s*<=\s*\w+\.length/)) {
                    issues.push(`Off-by-one error at line ${index + 1}: Loop uses <= instead of <`);
                  }
                });
                
                // Missing null checks on parameters
                if (code.includes('function includes(') && !code.includes('value === null') && !code.includes('value === undefined')) {
                  issues.push('Missing null/undefined check on value parameter in includes function');
                }
                
                // Array index without bounds check
                if (code.includes('[') && code.includes(']') && !code.includes('if.*<.*length')) {
                  issues.push('Array access without bounds checking');
                }
                
                if (issues.length > 0) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: `**Automated Review Issues Found:**\n\n${issues.map(i => `- ${i}`).join('\n')}\n\nFile: ${file.filename}`
                  });
                }
              }
            }